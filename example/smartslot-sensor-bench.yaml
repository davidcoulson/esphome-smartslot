# Bench config for the sensor ports: the bench board plus sensor-ports.yaml with a BME280 on port A.
# Port A uses GPIO26/27, the card's own pins: neither is used by smartslot-bench.yaml (it uses 20, 21, 31, 50-54).
# If your dev board's header lacks them, change sens_a_sda/sens_a_scl below; port B stays at its defaults (GPIO32/33).
substitutions:
  sens_a_sda: GPIO26
  sens_a_scl: GPIO27

packages:
  bench: !include smartslot-bench.yaml
  sensors: !include sensor-ports.yaml

esphome:
  name: smartslot-sensor-bench

sensor:
  - platform: bme280_i2c
    i2c_id: sens_a
    address: 0x77  # Adafruit 2652 default; bridging its SDO pad to GND gives 0x76
    temperature: { name: "Rack front temperature" }
    humidity: { name: "Rack front humidity" }
    pressure: { name: "Rack front pressure" }
    update_interval: 60s
