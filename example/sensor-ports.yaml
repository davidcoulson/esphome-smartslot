# Two RJ12 sensor ports (J8/J9), each a PCA9615 differential-I2C buffer on the smartslot-hw card.
# Override the pins in the including file's `substitutions:` (the including file wins over these defaults).
substitutions:
  sens_a_sda: GPIO26
  sens_a_scl: GPIO27
  sens_b_sda: GPIO32
  sens_b_scl: GPIO33

i2c:
  - id: sens_a
    sda: ${sens_a_sda}
    scl: ${sens_a_scl}
    frequency: 100kHz
    scan: true
  - id: sens_b
    sda: ${sens_b_sda}
    scl: ${sens_b_scl}
    frequency: 100kHz
    scan: true

