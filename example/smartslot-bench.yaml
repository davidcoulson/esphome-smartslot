# Bench config: ESP32-P4 board with an IP101 PHY, UART1 to a MAX3232 and the APC 940-0625A cable into the UPS front RJ45.
# Copy secrets.yaml.example to secrets.yaml and fill it in before `esphome run`.
esphome:
  name: smartslot-bench

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 16MB
  # engineering_sample: true   # set per `esptool chip_id` (revision < v3.0 needs it)

ethernet:
  id: eth
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1

external_components:
  - source:
      type: local
      path: ../components

smartslot:
  id: ups
  tx_pin: GPIO20
  rx_pin: GPIO21
  uart_sel_pin: GPIO53
  uart_sel_level: 0
  uart_num: 1
  cmdsrc: rj45        # bench cable; use smartslot1 in the real card
  baud_rate: 9600
  update_interval: 10s
  nut:
    port: 3493
    username: !secret nut_user
    password: !secret nut_password
  history:                   # on-flash history at /history; adds a `tsdb` partition (see README)
    size: 8MB                # 24MB on a 32 MB module
    interval: 5min

time:
  - platform: sntp           # history rows are keyed by real time

api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server       # firmware upload from the web UI
logger:
  level: INFO
web_server:
  version: 3
  local: true                  # UI assets served from flash; no internet needed
  auth:
    username: !secret web_user
    password: !secret web_password
    type: digest
  sorting_groups:
    - id: grp_status
      name: Status
      sorting_weight: 10
    - id: grp_battery
      name: Battery
      sorting_weight: 20
    - id: grp_power
      name: Input/Output
      sorting_weight: 30
    - id: grp_settings
      name: Settings
      sorting_weight: 40
status_led:
  pin: GPIO54

sensor:
  - platform: smartslot
    variable: battery.charge
    name: Battery charge
    unit_of_measurement: "%"
    web_server: { sorting_group_id: grp_battery }
  - platform: smartslot
    variable: battery.runtime
    name: Battery runtime
    unit_of_measurement: s
    device_class: duration
    web_server: { sorting_group_id: grp_battery }
  - platform: smartslot
    variable: battery.voltage
    name: Battery voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    web_server: { sorting_group_id: grp_battery }
  - platform: smartslot
    variable: input.voltage
    name: Input voltage
    unit_of_measurement: V
    web_server: { sorting_group_id: grp_power }
  - platform: smartslot
    variable: output.voltage
    name: Output voltage
    unit_of_measurement: V
    web_server: { sorting_group_id: grp_power }
  - platform: smartslot
    variable: ups.load
    name: Load
    unit_of_measurement: "%"
    web_server: { sorting_group_id: grp_power }
  - platform: smartslot
    variable: ups.temperature
    name: UPS temperature
    unit_of_measurement: °C
    device_class: temperature
    web_server: { sorting_group_id: grp_status }
  - platform: uptime
    name: Uptime
    web_server: { sorting_group_id: grp_status }
  - platform: template
    name: Stale polls
    lambda: return id(ups).stale_polls();
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 10s
    web_server: { sorting_group_id: grp_status }

binary_sensor:
  - platform: template
    name: Ethernet link
    device_class: connectivity
    lambda: return id(eth).is_connected();
    web_server: { sorting_group_id: grp_status }

text_sensor:
  - platform: smartslot
    variable: ups.status
    name: UPS status
    web_server: { sorting_group_id: grp_status }
  - platform: ethernet_info
    ip_address:
      name: IP address
      web_server: { sorting_group_id: grp_status }
    mac_address:
      name: MAC address
      web_server: { sorting_group_id: grp_status }

button:
  - platform: smartslot
    command: beeper.toggle
    name: Toggle beeper
    web_server: { sorting_group_id: grp_status }
  - platform: restart
    name: Reboot
    web_server: { sorting_group_id: grp_settings }

# Runtime settings: stored in flash (restore_value) and editable from the web UI.
# The UART pins, UART_SEL level and buffer bypass are fixed at setup (board jumpers), so there is no entity for them.
number:
  - platform: template
    name: Poll interval
    unit_of_measurement: s
    min_value: 2
    max_value: 300
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    entity_category: config
    web_server: { sorting_group_id: grp_settings }
    on_value:                  # also fires with the restored value at boot
      - lambda: |-
          id(ups).set_update_interval((uint32_t) (x * 1000));
          id(ups).stop_poller();
          id(ups).start_poller();

# TODO(snmp_agent): pass these to the snmp_agent component once it lands (branch snmp-agent); until then they are
# only stored.
text:
  - platform: template
    name: SNMP community
    mode: password
    optimistic: true
    restore_value: true
    initial_value: public
    max_length: 32
    entity_category: config
    web_server: { sorting_group_id: grp_settings }
  - platform: template
    name: sysName
    mode: text
    optimistic: true
    restore_value: true
    initial_value: smartslot
    max_length: 32
    entity_category: config
    web_server: { sorting_group_id: grp_settings }
  - platform: template
    name: sysLocation
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 32
    entity_category: config
    web_server: { sorting_group_id: grp_settings }
  - platform: template
    name: sysContact
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 32
    entity_category: config
    web_server: { sorting_group_id: grp_settings }
