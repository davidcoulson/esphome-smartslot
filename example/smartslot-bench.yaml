# SPDX-License-Identifier: GPL-2.0-or-later
# Bench config: ESP32-P4 board with an IP101 PHY, UART1 to a MAX3232 and the APC 940-0625A cable into the UPS front RJ45.
# Copy secrets.yaml.example to secrets.yaml and fill it in before `esphome run`.
esphome:
  name: smartslot-bench

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 16MB
  # engineering_sample: true   # set per `esptool chip_id` (revision < v3.0 needs it)

ethernet:
  id: eth
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1

external_components:
  - source:
      type: local
      path: ../components

smartslot:
  id: ups
  tx_pin: GPIO20
  rx_pin: GPIO21
  uart_sel_pin: GPIO53
  uart_sel_level: 0
  uart_num: 1
  cmdsrc: rj45        # bench cable; use smartslot1 in the real card
  baud_rate: 9600
  update_interval: 10s
  nut:
    port: 3493
    username: !secret nut_user
    password: !secret nut_password
  history:                   # on-flash history at /history; adds a `tsdb` partition (see README)
    size: 8MB                # 24MB on a 32 MB module
    interval: 5min

time:
  - platform: sntp           # history rows are keyed by real time

api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server       # firmware upload from the web UI
logger:
  level: INFO

# Log forwarding: UPS events (status changes, communication lost/established, traps sent) are logged at INFO.
udp:
  addresses: [!secret syslog_host]
syslog:
  level: INFO
  port: 514

# MQTT alongside the native API, for brokers and tools other than Home Assistant. Discovery is off because the API
# already creates the Home Assistant entities; turn it on (and drop api:) for an MQTT-only setup.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  reboot_timeout: 0s           # a broker outage must not restart the card
web_server:
  version: 3
  local: true                  # UI assets served from flash; no internet needed
  auth:
    username: !secret web_user
    password: !secret web_password
    type: digest
  sorting_groups:
    - id: grp_status
      name: Status
      sorting_weight: 10
    - id: grp_battery
      name: Battery
      sorting_weight: 20
    - id: grp_power
      name: Input/Output
      sorting_weight: 30
    - id: grp_control
      name: Control
      sorting_weight: 35
    - id: grp_settings
      name: Settings
      sorting_weight: 40

# Readings go unknown 20 s after the UPS stops answering (see "UPS data age" for how old the last good poll is),
# so a page or HA card never shows a frozen value as live. sorting_weight orders rows on the web page; state_class
# lets Home Assistant keep statistics.
sensor:
  - platform: smartslot
    id: battery_charge
    variable: battery.charge
    name: Battery charge
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    web_server: { sorting_group_id: grp_battery, sorting_weight: 1 }
  - platform: smartslot
    id: battery_runtime
    variable: battery.runtime
    name: Battery runtime
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    web_server: { sorting_group_id: grp_battery, sorting_weight: 2 }
  - platform: smartslot
    id: battery_voltage
    variable: battery.voltage
    name: Battery voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    web_server: { sorting_group_id: grp_battery, sorting_weight: 3 }
  - platform: smartslot
    id: battery_temp
    variable: battery.temperature
    name: Battery temperature
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    web_server: { sorting_group_id: grp_battery, sorting_weight: 4 }
  - platform: smartslot
    id: input_voltage
    variable: input.voltage
    name: Input voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    web_server: { sorting_group_id: grp_power, sorting_weight: 1 }
  - platform: smartslot
    id: output_voltage
    variable: output.voltage
    name: Output voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    web_server: { sorting_group_id: grp_power, sorting_weight: 2 }
  - platform: smartslot
    id: ups_load
    variable: ups.load
    name: Load
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:gauge
    web_server: { sorting_group_id: grp_power, sorting_weight: 3 }
  - platform: smartslot
    id: ups_temp
    variable: ups.temperature
    name: UPS temperature
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    web_server: { sorting_group_id: grp_status, sorting_weight: 5 }
  - platform: template
    name: UPS data age
    lambda: return id(ups).data_age();
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:clock-check-outline
    update_interval: 10s
    web_server: { sorting_group_id: grp_status, sorting_weight: 4 }
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
    web_server: { sorting_group_id: grp_status, sorting_weight: 60 }
  - platform: template
    name: Stale polls
    lambda: return id(ups).stale_polls();
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 10s
    web_server: { sorting_group_id: grp_status, sorting_weight: 64 }

binary_sensor:
  - platform: template
    id: ups_link
    name: UPS communication
    device_class: connectivity
    lambda: return id(ups).online();
    web_server: { sorting_group_id: grp_status, sorting_weight: 2 }
  - platform: template
    name: Ethernet link
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(eth).is_connected();
    web_server: { sorting_group_id: grp_status, sorting_weight: 61 }

text_sensor:
  - platform: template
    name: Status
    icon: mdi:power-plug-outline
    update_interval: 10s
    web_server: { sorting_group_id: grp_status, sorting_weight: 1 }
    lambda: |-
      // ups.status is NUT's token list ("OL CHRG"); spelled out here for people. SNMP and traps keep the raw one.
      static const std::pair<const char *, const char *> words[] = {
          {"OL", "On line"}, {"OB", "On battery"}, {"LB", "low battery"}, {"HB", "high battery"},
          {"RB", "replace battery"}, {"CHRG", "charging"}, {"DISCHRG", "discharging"}, {"BYPASS", "bypass"},
          {"CAL", "calibrating"}, {"OFF", "Output off"}, {"OVER", "overload"}, {"TRIM", "trimming"},
          {"BOOST", "boosting"}, {"FSD", "shutdown pending"}, {"ALARM", "alarm"}};
      if (!id(ups).online()) return std::string("No contact with UPS");
      std::string out, raw = id(ups_status).state + " ";
      for (size_t a = 0, b; (b = raw.find(' ', a)) != std::string::npos; a = b + 1) {
        std::string tok = raw.substr(a, b - a);
        if (tok.empty()) continue;
        const char *w = tok.c_str();
        for (auto &p : words) if (tok == p.first) { w = p.second; break; }
        out += (out.empty() ? "" : ", ") + std::string(w);
      }
      return out.empty() ? std::string("Unknown") : out;
  - platform: smartslot
    id: ups_alarm
    variable: ups.alarm
    name: UPS alarm
    icon: mdi:alert-outline
    web_server: { sorting_group_id: grp_status, sorting_weight: 3 }
  - platform: smartslot
    id: ups_status
    variable: ups.status
    name: Status code
    entity_category: diagnostic
    web_server: { sorting_group_id: grp_status, sorting_weight: 50 }
  - platform: smartslot
    id: ups_model
    variable: ups.model
    name: UPS model
    entity_category: diagnostic
    web_server: { sorting_group_id: grp_status, sorting_weight: 51 }
  - platform: ethernet_info
    ip_address:
      name: IP address
      entity_category: diagnostic
      web_server: { sorting_group_id: grp_status, sorting_weight: 62 }
    mac_address:
      name: MAC address
      entity_category: diagnostic
      web_server: { sorting_group_id: grp_status, sorting_weight: 63 }

# UPS controls. The web UI has no confirmation step, so the commands that drop the load are sent only while
# "Arm load or shutdown" is on; the switch turns itself off after one command or 30 s.
switch:
  - platform: template
    id: arm_controls
    name: Arm load or shutdown
    icon: mdi:shield-alert
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server: { sorting_group_id: grp_control }
    turn_on_action:            # the template switch cancels this on turn-off, so a re-arm gets a fresh 30 s
      - delay: 30s
      - switch.turn_off: arm_controls

button:
  - platform: smartslot
    command: beeper.toggle
    name: Toggle beeper
    web_server: { sorting_group_id: grp_control }
  - platform: smartslot
    command: test.battery.start
    name: Battery self-test
    icon: mdi:battery-heart-variant
    web_server: { sorting_group_id: grp_control }
  - platform: smartslot
    command: test.panel.start
    name: Panel test
    icon: mdi:television-ambient-light
    web_server: { sorting_group_id: grp_control }
  - platform: smartslot
    command: calibrate.start
    name: Start runtime calibration
    icon: mdi:battery-clock
    web_server: { sorting_group_id: grp_control }
  - platform: smartslot
    command: calibrate.stop
    name: Stop runtime calibration
    icon: mdi:battery-clock-outline
    web_server: { sorting_group_id: grp_control }
  - platform: smartslot
    command: load.off
    name: Load off
    arm: arm_controls
    icon: mdi:power-plug-off
    web_server: { sorting_group_id: grp_control }
  - platform: smartslot
    command: load.on
    name: Load on
    icon: mdi:power-plug
    web_server: { sorting_group_id: grp_control }
  - platform: smartslot
    command: shutdown.return
    name: Shutdown, return on mains
    arm: arm_controls
    icon: mdi:power-cycle
    web_server: { sorting_group_id: grp_control }
  - platform: restart
    name: Reboot
    web_server: { sorting_group_id: grp_settings }


# SNMPv1/v2c agent (read-only). Default table: APC PowerNet MIB (what NUT snmp-ups mibs=apcc and most monitoring
# tools query) plus the RFC 1628 UPS-MIB. Add an OID by adding a line here; no C++ needed.
# type: integer | gauge | timeticks | string | oid; scale multiplies the sensor value first.
# map (text sensor -> number): first token of the state that matches wins, "*" is the fallback.
snmp_agent:
  port: 161
  community: public          # v1/v2c, read-only; set v2c: false to serve SNMPv3 only
  # SNMPv3 (USM). Auth md5|sha|sha224|sha256|sha384|sha512, priv aes (AES-128); passwords at least 8 characters.
  # Each user is served at exactly its configured level. The engine ID (80:00:01:3e:05 + MAC + salt) is in the log.
  users:
    - name: monitor
      auth_protocol: sha256
      auth_password: !secret snmp_auth_password
      priv_protocol: aes
      priv_password: !secret snmp_priv_password
  # PowerNet-MIB traps: coldStart at boot, on battery / power restored, low battery, overload, replace battery,
  # output off, and communication lost / established. v2c with the community above, or v3 with user:.
  traps:
    status: ups_status
    link: ups_link
    receivers:
      - host: !secret trap_host
      # - { host: 192.168.1.20, user: monitor }
  sys_contact: admin@example.com
  sys_location: Rack 1
  readings:
    # --- APC PowerNet MIB, 1.3.6.1.4.1.318.1.1.1
    - { oid: 1.3.6.1.4.1.318.1.1.1.1.1.1.0, text_sensor: ups_model, type: string }          # upsBasicIdentModel
    - oid: 1.3.6.1.4.1.318.1.1.1.2.1.1.0                                                    # upsBasicBatteryStatus
      text_sensor: ups_status
      type: integer
      map: { LB: 3, RB: 4, "*": 2 }                  # 2 normal, 3 low, 4 fault (replace battery)
    - { oid: 1.3.6.1.4.1.318.1.1.1.2.2.1.0, sensor: battery_charge, type: gauge }           # upsAdvBatteryCapacity %
    - { oid: 1.3.6.1.4.1.318.1.1.1.2.2.2.0, sensor: battery_temp, type: gauge }             # upsAdvBatteryTemperature C
    - { oid: 1.3.6.1.4.1.318.1.1.1.2.2.3.0, sensor: battery_runtime, type: timeticks, scale: 100 }  # RunTimeRemaining, 1/100 s
    - { oid: 1.3.6.1.4.1.318.1.1.1.3.2.1.0, sensor: input_voltage, type: gauge }            # upsAdvInputLineVoltage
    - { oid: 1.3.6.1.4.1.318.1.1.1.4.2.1.0, sensor: output_voltage, type: gauge }           # upsAdvOutputVoltage
    - { oid: 1.3.6.1.4.1.318.1.1.1.4.2.3.0, sensor: ups_load, type: gauge }                 # upsAdvOutputLoad %
    - oid: 1.3.6.1.4.1.318.1.1.1.4.1.1.0                                                    # upsBasicOutputStatus
      text_sensor: ups_status
      type: integer
      map: { OB: 3, BYPASS: 6, OFF: 7, OL: 2, "*": 1 }  # 2 onLine, 3 onBattery, 6 softwareBypass, 7 off, 1 unknown
    # --- RFC 1628 UPS-MIB, 1.3.6.1.2.1.33.1
    - { oid: 1.3.6.1.2.1.33.1.1.1.0, value: APC, type: string }                             # upsIdentManufacturer
    - { oid: 1.3.6.1.2.1.33.1.1.2.0, text_sensor: ups_model, type: string }                 # upsIdentModel
    - oid: 1.3.6.1.2.1.33.1.2.1.0                                                           # upsBatteryStatus
      text_sensor: ups_status
      type: integer
      map: { LB: 3, RB: 4, "*": 2 }                  # 2 normal, 3 low, 4 depleted
    - { oid: 1.3.6.1.2.1.33.1.2.3.0, sensor: battery_runtime, type: integer, scale: 0.016667 }  # upsEstimatedMinutesRemaining
    - { oid: 1.3.6.1.2.1.33.1.2.4.0, sensor: battery_charge, type: integer }                # upsEstimatedChargeRemaining %
    - { oid: 1.3.6.1.2.1.33.1.2.7.0, sensor: battery_temp, type: integer }                  # upsBatteryTemperature C
    - { oid: 1.3.6.1.2.1.33.1.3.2.0, value: "1", type: integer }                            # upsInputNumLines
    - { oid: 1.3.6.1.2.1.33.1.3.3.1.3.1, sensor: input_voltage, type: integer }             # upsInputVoltage[1]
    - oid: 1.3.6.1.2.1.33.1.4.1.0                                                           # upsOutputSource
      text_sensor: ups_status
      type: integer
      map: { OB: 5, BYPASS: 4, OFF: 2, OL: 3, "*": 1 }  # 3 normal, 5 battery, 4 bypass, 2 none, 1 other
    - { oid: 1.3.6.1.2.1.33.1.4.3.0, value: "1", type: integer }                            # upsOutputNumLines
    - { oid: 1.3.6.1.2.1.33.1.4.4.1.2.1, sensor: output_voltage, type: integer }            # upsOutputVoltage[1]
    - { oid: 1.3.6.1.2.1.33.1.4.4.1.5.1, sensor: ups_load, type: integer }                  # upsOutputPercentLoad[1]
# Runtime settings: stored in flash (restore_value) and editable from the web UI.
# The UART pins, UART_SEL level and buffer bypass are fixed at setup (board jumpers), so there is no entity for them.
number:
  - platform: template
    name: Publish interval      # how often entities are published; the driver polls the UPS every 2 s regardless
    unit_of_measurement: s
    min_value: 2
    max_value: 300
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    entity_category: config
    web_server: { sorting_group_id: grp_settings }
    on_value:                  # also fires with the restored value at boot
      - lambda: |-
          id(ups).set_update_interval((uint32_t) (x * 1000));
          id(ups).stop_poller();
          id(ups).start_poller();

# TODO: feed these into snmp_agent at runtime; today snmp_agent takes community/sysName from its own block above, so
# these are only stored.
text:
  - platform: template
    name: SNMP community
    mode: password
    optimistic: true
    restore_value: true
    initial_value: public
    max_length: 32
    entity_category: config
    web_server: { sorting_group_id: grp_settings }
  - platform: template
    name: sysName
    mode: text
    optimistic: true
    restore_value: true
    initial_value: smartslot
    max_length: 32
    entity_category: config
    web_server: { sorting_group_id: grp_settings }
  - platform: template
    name: sysLocation
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 32
    entity_category: config
    web_server: { sorting_group_id: grp_settings }
  - platform: template
    name: sysContact
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 32
    entity_category: config
    web_server: { sorting_group_id: grp_settings }
