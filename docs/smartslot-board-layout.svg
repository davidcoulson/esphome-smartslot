<text x="20" y="780" class="key"><tspan font-weight="bold">Zones:</tspan> red = power in (slot pins 1–4 → PS1); blue = UART interface to pins 8/9/11; dark = PHY, ESD; purple = module; grey = bracket connectors; gold squares = test pads. Everything on this face; the back face carries only the even fingers, decoupling and the ground pour.</text>
<text x="20" y="800" class="key">Empty area is intentional: the APC outline is kept so the card fits the slot guides and bracket; a later revision can shrink the board.</text>
